tools:
- name: load_video
  description: Load and validate a local video path for the video-to-transcript workflow.
  category: video_transcription_input
  entrypoints:
    cli: null
    workflow_node: load_video
    python: agentflow_studio.workflow_engine.transcription_nodes.load_video_node
  input_artifacts:
  - input_video_path
  output_artifacts:
  - workflow_state.video_path
  requires:
    ffmpeg: false
    network: false
    model_provider: false
    api_key: false
  failure_modes:
  - video_path_missing
  - video_file_missing
  quality_checks:
  - input_video_file_exists
  agent_usage:
    safe_for_auto_execute: true
    requires_human_review: false
    mutates_workflow: false
    executes_external_process: false
- name: extract_audio
  description: Extract or mock a local audio artifact from a video for ASR.
  category: video_transcription_audio
  entrypoints:
    cli: null
    workflow_node: extract_audio
    python: agentflow_studio.audio_sop.extract_audio_from_video
  input_artifacts:
  - input_video_path
  output_artifacts:
  - audio_manifest.json
  - audio/audio.wav
  requires:
    ffmpeg: true
    network: false
    model_provider: false
    api_key: false
  failure_modes:
  - input_video_missing
  - ffmpeg_executable_not_found
  - ffmpeg_audio_extract_failed
  - audio_artifact_write_failed
  quality_checks:
  - audio_manifest_exists
  - audio_artifact_exists
  - audio_manifest_status
  agent_usage:
    safe_for_auto_execute: false
    requires_human_review: true
    mutates_workflow: false
    executes_external_process: true
- name: analyze_audio_boundary_signals
  description: Analyze a local WAV audio artifact for low-energy boundary points and energy peaks.
  category: media_boundary_signal
  entrypoints:
    cli: null
    workflow_node: analyze_audio_boundary_signals
    python: agentflow_studio.audio_sop.analyze_audio_boundary_signals
  input_artifacts:
  - audio/audio.wav
  - workflow_state.audio
  output_artifacts:
  - boundary_signal_manifest.json
  requires:
    ffmpeg: false
    network: false
    model_provider: false
    api_key: false
  failure_modes:
  - audio_path_missing
  - unsupported_audio_format
  - audio_boundary_analysis_failed
  quality_checks:
  - boundary_signal_manifest_exists
  - boundary_signal_status_recorded
  - boundary_points_optional
  agent_usage:
    safe_for_auto_execute: true
    requires_human_review: false
    mutates_workflow: false
    executes_external_process: false
- name: transcribe_audio_mock
  description: Convert an audio artifact into a timestamped Transcript using a local fixture-backed mock ASR provider.
  category: video_transcription_asr
  entrypoints:
    cli: null
    workflow_node: transcribe_audio_mock
    python: agentflow_studio.asr_sop.MockASRProvider
  input_artifacts:
  - audio_manifest.json
  - asr_fixture.json
  output_artifacts:
  - workflow_state.transcript
  requires:
    ffmpeg: false
    network: false
    model_provider: false
    api_key: false
  failure_modes:
  - audio_artifact_failed
  - asr_fixture_missing
  - asr_fixture_invalid_json
  - transcript_schema_invalid
  quality_checks:
  - transcript_segments_non_empty
  - transcript_timestamps_valid
  agent_usage:
    safe_for_auto_execute: true
    requires_human_review: false
    mutates_workflow: false
    executes_external_process: false
- name: transcribe_audio_openai_compatible
  description: Convert an audio artifact into a timestamped Transcript using an explicitly enabled OpenAI-compatible ASR provider.
  category: video_transcription_asr
  entrypoints:
    cli: null
    workflow_node: transcribe_audio_openai_compatible
    python: agentflow_studio.asr_sop.OpenAICompatibleASRProvider
  input_artifacts:
  - audio_manifest.json
  - audio/audio.wav
  output_artifacts:
  - workflow_state.transcript
  requires:
    ffmpeg: false
    network: true
    model_provider: true
    api_key: true
  failure_modes:
  - remote_asr_not_enabled
  - api_key_missing
  - audio_artifact_missing
  - asr_request_failed
  - transcript_schema_invalid
  quality_checks:
  - transcript_segments_non_empty
  - transcript_timestamps_valid
  agent_usage:
    safe_for_auto_execute: false
    requires_human_review: true
    mutates_workflow: false
    executes_external_process: false
- name: transcribe_audio_faster_whisper
  description: Convert an audio artifact into a timestamped Transcript using a local faster-whisper model.
  category: video_transcription_asr
  entrypoints:
    cli: null
    workflow_node: transcribe_audio_faster_whisper
    python: agentflow_studio.asr_sop.FasterWhisperASRProvider
  input_artifacts:
  - audio_manifest.json
  - audio/audio.wav
  output_artifacts:
  - workflow_state.transcript
  requires:
    ffmpeg: false
    network: false
    model_provider: true
    api_key: false
  failure_modes:
  - local_asr_dependency_missing
  - audio_artifact_missing
  - local_asr_transcription_failed
  - transcript_schema_invalid
  quality_checks:
  - transcript_segments_non_empty
  - transcript_timestamps_valid
  agent_usage:
    safe_for_auto_execute: false
    requires_human_review: true
    mutates_workflow: false
    executes_external_process: true
- name: write_transcript
  description: Write the current timestamped Transcript state to transcript.json.
  category: video_transcription_output
  entrypoints:
    cli: null
    workflow_node: write_transcript
    python: agentflow_studio.workflow_engine.transcription_nodes.write_transcript_node
  input_artifacts:
  - workflow_state.transcript
  output_artifacts:
  - transcript.json
  requires:
    ffmpeg: false
    network: false
    model_provider: false
    api_key: false
  failure_modes:
  - transcript_missing
  - transcript_write_failed
  quality_checks:
  - transcript_file_exists
  - transcript_schema_valid
  agent_usage:
    safe_for_auto_execute: true
    requires_human_review: false
    mutates_workflow: false
    executes_external_process: false
