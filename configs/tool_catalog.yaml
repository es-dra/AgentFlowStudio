      - ffmpeg_unavailable
      - ffmpeg_concat_failed
    quality_checks:
      - final_video_manifest_exists
      - final_video_manifest_status
      - final_video_file_exists
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: probe_final_video
    description: Probe the assembled final video and enrich final_video_manifest.json.
