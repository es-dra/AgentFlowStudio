version: 1
project: NarratoCut
catalog_kind: static_tool_contracts
scope: phase_7_5b_agent_readable_catalog
tools:
  - name: analyze_hooks
    description: Analyze a UTF-8 source text file and produce hook candidates.
    category: roi_analysis
    entrypoints:
      cli: ncut analyze-hooks
      workflow_node: analyze_hooks
      python: narratocut.roi_sop.analyze_hooks_from_text
    input_artifacts:
      - text_file
    output_artifacts:
      - hooks.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - input_text_missing
      - empty_text
      - hooks_schema_invalid
    quality_checks:
      - hooks_file_exists
      - hooks_non_empty
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: generate_scripts
    description: Generate mock short-video scripts from hook candidates.
    category: script_generation
    entrypoints:
      cli: ncut generate-scripts
      workflow_node: generate_scripts
      python: narratocut.roi_sop.generate_scripts_from_hooks
    input_artifacts:
      - hooks.json
    output_artifacts:
      - scripts.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - hooks_missing
      - hooks_schema_invalid
      - scripts_schema_invalid
    quality_checks:
      - scripts_file_exists
      - scripts_non_empty
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: generate_clip_plans
    description: Generate deterministic clip planning contracts from scripts.
    category: clip_planning
    entrypoints:
      cli: ncut generate-clip-plans
      workflow_node: generate_clip_plans
      python: narratocut.slicing_sop.generate_clip_plans_from_scripts
    input_artifacts:
      - scripts.json
    output_artifacts:
      - clip_plans.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - scripts_missing
      - scripts_schema_invalid
      - clip_plan_time_range_invalid
    quality_checks:
      - clip_plans_file_exists
      - clip_plans_non_empty
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: mock_slice
    description: Generate mock clip text files and a slice manifest from clip plans.
    category: mock_slicing
    entrypoints:
      cli: ncut mock-slice
      workflow_node: mock_slice
      python: narratocut.slicing_sop.mock_slice_clip_plans
    input_artifacts:
      - clip_plans.json
    output_artifacts:
      - slice_manifest.json
      - clips/
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - clip_plans_missing
      - clip_plans_schema_invalid
      - mock_clip_write_failed
    quality_checks:
      - slice_manifest_exists
      - clips_dir_exists
      - mock_clips_count_matches_manifest
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: build_ffmpeg_command_contract
    description: Build a minimal FFmpeg slicing command list without executing FFmpeg.
    category: real_slicing_contract
    entrypoints:
      cli: null
      workflow_node: null
      python: narratocut.slicing_sop.build_ffmpeg_slice_command
    input_artifacts:
      - input_video_path
      - start_sec
      - duration_sec
      - output_video_path
    output_artifacts:
      - ffmpeg_command
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - invalid_input_path
      - invalid_time_range
      - invalid_output_extension
    quality_checks:
      - ffmpeg_command_has_expected_args
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: slice_real
    description: Execute minimal local FFmpeg slicing from clip plans.
    category: real_slicing_poc
    entrypoints:
      cli: ncut slice-real
      workflow_node: null
      python: narratocut.slicing_sop.slice_clip_plans_real
    input_artifacts:
      - input_video_path
      - clip_plans.json
    output_artifacts:
      - real_slice_manifest.json
      - clips/*.mp4
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - input_video_missing
      - clip_plans_missing
      - clip_plans_schema_invalid
      - ffmpeg_executable_not_found
      - ffmpeg_execution_failed
    quality_checks:
      - real_slice_manifest_exists
      - real_clips_written
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: probe_video_metadata
    description: Read local video metadata through FFprobe and write video_metadata.json.
    category: real_video_metadata
    entrypoints:
      cli: null
      workflow_node: probe_video_metadata
      python: narratocut.slicing_sop.probe_video_metadata
    input_artifacts:
      - input_video_path
      - ffprobe_executable
    output_artifacts:
      - video_metadata.json
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - input_video_missing
      - ffprobe_unavailable
      - ffprobe_execution_failed
      - video_metadata_parse_failed
    quality_checks:
      - video_metadata_exists
      - video_metadata_status
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: validate_clip_plan
    description: Validate one ClipPlan against ROISettings, video metadata, and FFmpeg availability.
    category: real_video_validation
    entrypoints:
      cli: null
      workflow_node: validate_clip_plan
      python: narratocut.slicing_sop.validate_clip_plan
    input_artifacts:
      - clip_plan.json
      - roi_config.json
      - video_metadata.json
    output_artifacts:
      - clip_plan_validation.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - empty_clip_plan
      - invalid_segment_time_range
      - segment_outside_video_duration
      - unsafe_output_filename
      - ffmpeg_unavailable
    quality_checks:
      - clip_plan_validation_exists
      - clip_plan_validation_status
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: real_slice_video
    description: Execute the real-video workflow slicing node after validation succeeds.
    category: real_video_workflow_node
    entrypoints:
      cli: null
      workflow_node: real_slice_video
      python: narratocut.slicing_sop.slice_clip_plans_real
    input_artifacts:
      - input_video_path
      - clip_plan.json
      - clip_plan_validation.json
    output_artifacts:
      - real_slice_manifest.json
      - clips/*.mp4
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - clip_plan_validation_failed
      - ffmpeg_unavailable
      - ffmpeg_execution_failed
      - real_clip_write_failed
    quality_checks:
      - real_slice_manifest_exists
      - real_slice_manifest_status
      - real_clips_written
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: load_real_slice_manifest
    description: Load a real slicing manifest for final video assembly.
    category: video_assembly_input
    entrypoints:
      cli: null
      workflow_node: load_real_slice_manifest
      python: narratocut.workflow_engine.assembly_nodes.load_real_slice_manifest_node
    input_artifacts:
      - real_slice_manifest.json
    output_artifacts:
      - real_slice_manifest.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - real_slice_manifest_missing
      - real_slice_manifest_invalid_json
    quality_checks:
      - real_slice_manifest_exists
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: generate_assembly_plan
    description: Generate a simple ordered assembly plan from successful real clips.
    category: video_assembly_planning
    entrypoints:
      cli: null
      workflow_node: generate_assembly_plan
      python: narratocut.assembly_sop.build_assembly_plan
    input_artifacts:
      - real_slice_manifest.json
    output_artifacts:
      - assembly_plan.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - real_slice_manifest_has_no_successful_clips
    quality_checks:
      - assembly_plan_exists
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: concat_clips
    description: Concatenate ordered clip files into final_video.mp4 with FFmpeg.
    category: video_assembly_execution
    entrypoints:
      cli: null
      workflow_node: concat_clips
      python: narratocut.assembly_sop.concat_clips
    input_artifacts:
      - assembly_plan.json
      - clips/*.mp4
    output_artifacts:
      - concat_list.txt
      - final_video.mp4
      - final_video_manifest.json
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - input_clip_missing
      - ffmpeg_unavailable
      - ffmpeg_concat_failed
    quality_checks:
      - final_video_manifest_exists
      - final_video_manifest_status
      - final_video_file_exists
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: probe_final_video
    description: Probe the assembled final video and enrich final_video_manifest.json.
    category: video_assembly_metadata
    entrypoints:
      cli: null
      workflow_node: probe_final_video
      python: narratocut.slicing_sop.probe_video_metadata
    input_artifacts:
      - final_video.mp4
      - final_video_manifest.json
    output_artifacts:
      - final_video_manifest.json
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - ffprobe_unavailable
      - final_video_probe_failed
    quality_checks:
      - final_video_duration_tolerance
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: load_video
    description: Load and validate a local video path for the video-to-transcript workflow.
    category: video_transcription_input
    entrypoints:
      cli: null
      workflow_node: load_video
      python: narratocut.workflow_engine.transcription_nodes.load_video_node
    input_artifacts:
      - input_video_path
    output_artifacts:
      - workflow_state.video_path
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - video_path_missing
      - video_file_missing
    quality_checks:
      - input_video_file_exists
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: extract_audio
    description: Extract or mock a local audio artifact from a video for ASR.
    category: video_transcription_audio
    entrypoints:
      cli: null
      workflow_node: extract_audio
      python: narratocut.audio_sop.extract_audio_from_video
    input_artifacts:
      - input_video_path
    output_artifacts:
      - audio_manifest.json
      - audio/audio.wav
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - input_video_missing
      - ffmpeg_executable_not_found
      - ffmpeg_audio_extract_failed
      - audio_artifact_write_failed
    quality_checks:
      - audio_manifest_exists
      - audio_artifact_exists
      - audio_manifest_status
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: transcribe_audio_mock
    description: Convert an audio artifact into a timestamped Transcript using a local fixture-backed mock ASR provider.
    category: video_transcription_asr
    entrypoints:
      cli: null
      workflow_node: transcribe_audio_mock
      python: narratocut.asr_sop.MockASRProvider
    input_artifacts:
      - audio_manifest.json
      - asr_fixture.json
    output_artifacts:
      - workflow_state.transcript
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - audio_artifact_failed
      - asr_fixture_missing
      - asr_fixture_invalid_json
      - transcript_schema_invalid
    quality_checks:
      - transcript_segments_non_empty
      - transcript_timestamps_valid
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: transcribe_audio_openai_compatible
    description: Convert an audio artifact into a timestamped Transcript using an explicitly enabled OpenAI-compatible ASR provider.
    category: video_transcription_asr
    entrypoints:
      cli: null
      workflow_node: transcribe_audio_openai_compatible
      python: narratocut.asr_sop.OpenAICompatibleASRProvider
    input_artifacts:
      - audio_manifest.json
      - audio/audio.wav
    output_artifacts:
      - workflow_state.transcript
    requires:
      ffmpeg: false
      network: true
      model_provider: true
      api_key: true
    failure_modes:
      - remote_asr_not_enabled
      - api_key_missing
      - audio_artifact_missing
      - asr_request_failed
      - transcript_schema_invalid
    quality_checks:
      - transcript_segments_non_empty
      - transcript_timestamps_valid
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: false

  - name: write_transcript
    description: Write the current timestamped Transcript state to transcript.json.
    category: video_transcription_output
    entrypoints:
      cli: null
      workflow_node: write_transcript
      python: narratocut.workflow_engine.transcription_nodes.write_transcript_node
    input_artifacts:
      - workflow_state.transcript
    output_artifacts:
      - transcript.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - transcript_missing
      - transcript_write_failed
    quality_checks:
      - transcript_file_exists
      - transcript_schema_valid
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: write_subtitles
    description: Export a timestamped Transcript to subtitles.srt and subtitle_manifest.json.
    category: subtitle_export
    entrypoints:
      cli: null
      workflow_node: write_subtitles
      python: narratocut.subtitle_sop.build_subtitle_export
    input_artifacts:
      - workflow_state.transcript
    output_artifacts:
      - subtitles.srt
      - subtitle_manifest.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - transcript_missing
      - subtitle_segments_not_monotonic
      - subtitle_text_empty
      - subtitle_write_failed
    quality_checks:
      - subtitle_manifest_exists
      - subtitle_manifest_status
      - subtitle_file_exists
      - subtitle_cue_count_matches_manifest
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false

  - name: burn_subtitles
    description: Burn an existing subtitles.srt file into an existing final video with FFmpeg.
    category: subtitle_burn_execution
    entrypoints:
      cli: null
      workflow_node: burn_subtitles
      python: narratocut.subtitle_burn_sop.burn_subtitles_into_video
    input_artifacts:
      - final_video.mp4
      - subtitles.srt
    output_artifacts:
      - final_video_with_subtitles.mp4
      - subtitle_burn_manifest.json
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - source_video_missing
      - subtitles_missing
      - unsafe_output_name
      - ffmpeg_unavailable
      - ffmpeg_subtitle_burn_failed
    quality_checks:
      - subtitle_burn_manifest_exists
      - subtitle_burn_manifest_status
      - subtitle_burn_output_file_exists
      - subtitle_burn_ffmpeg_returncode
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: probe_subtitle_burn
    description: Probe the subtitle-burned output video and enrich subtitle_burn_manifest.json.
    category: subtitle_burn_metadata
    entrypoints:
      cli: null
      workflow_node: probe_subtitle_burn
      python: narratocut.slicing_sop.probe_video_metadata
    input_artifacts:
      - final_video_with_subtitles.mp4
      - subtitle_burn_manifest.json
    output_artifacts:
      - subtitle_burn_manifest.json
    requires:
      ffmpeg: true
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - ffprobe_unavailable
      - subtitle_burn_video_probe_failed
    quality_checks:
      - subtitle_burn_video_stream_present
      - subtitle_burn_output_file_size_positive
    agent_usage:
      safe_for_auto_execute: false
      requires_human_review: true
      mutates_workflow: false
      executes_external_process: true

  - name: inspect_run
    description: Inspect a workflow run directory and write quality_report.json.
    category: harness_inspection
    entrypoints:
      cli: ncut inspect-run
      workflow_node: null
      python: narratocut.harness.inspect_run
    input_artifacts:
      - run_dir
    output_artifacts:
      - quality_report.json
    requires:
      ffmpeg: false
      network: false
      model_provider: false
      api_key: false
    failure_modes:
      - run_dir_missing
      - required_artifact_missing
      - quality_check_failed
    quality_checks:
      - run_manifest_file_exists
      - trace_file_exists
      - mock_clips_count_matches_manifest
    agent_usage:
      safe_for_auto_execute: true
      requires_human_review: false
      mutates_workflow: false
      executes_external_process: false
