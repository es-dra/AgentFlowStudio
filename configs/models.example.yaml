default_provider: mock

providers:
  mock:
    type: mock
    model: mock-local

  openai_compatible:
    type: openai_compatible
    base_url: ${AFS_OPENAI_BASE_URL}
    api_key_env: AFS_OPENAI_API_KEY
    model: ${AFS_OPENAI_MODEL}

  minimax_m3:
    type: openai_compatible
    base_url: https://api.minimaxi.com/v1
    api_key_env: MINIMAX_API_KEY
    model: MiniMax-M3
    timeout_sec: 90
    temperature: 0.2
    max_completion_tokens: 1800
    extra_body:
      thinking:
        type: disabled
