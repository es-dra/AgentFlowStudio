[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-studio"
version = "0.1.0"
description = "AI-assisted short video production workflow MVP for story-driven content."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2,<3",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
afs = "apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "agentflow*", "agentflow_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: tests that require an explicitly authorized remote provider call",
    "legacy: frozen legacy island (distribution chain + production-memory), not a merge gate",
    "slow: slower end-to-end or browser/runtime tests skipped during daily focused runs",
]
addopts = "-m 'not legacy'"
