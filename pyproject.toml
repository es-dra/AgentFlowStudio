[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow-studio"
version = "0.1.0"
description = "AI-assisted short video production workflow MVP for story-driven content."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2",
    "typer",
    "pyyaml",
    "python-dotenv",
    "httpx",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
afs = "apps.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "agentflow*", "agentflow_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
