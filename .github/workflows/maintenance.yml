name: AFS Maintenance Gate

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  maintenance:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      AFS_ALLOW_REMOTE_LLM: "false"
      AFS_ALLOW_REMOTE_ASR: "false"
      AFS_ALLOW_REMOTE_IMAGE: "false"
      AFS_ALLOW_REMOTE_VIDEO: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: CLI smoke
        shell: pwsh
        run: |
          python -m apps.cli.main --help
          python -m apps.cli.main version

      - name: Maintenance audit
        shell: pwsh
        run: python tools/maintenance_audit.py

      - name: Tests
        shell: pwsh
        run: python -m pytest

      - name: Whitespace check
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            git diff --check "origin/$env:GITHUB_BASE_REF...HEAD"
          } elseif (git rev-parse --verify HEAD~1) {
            git diff --check "HEAD~1..HEAD"
          } else {
            git diff --check
          }
