name: video_subtitle_ocr_to_highlight_plan
version: 1
mode: ocr_candidate_scoring
quality_profile: candidate_scoring
steps:
  - id: load_video
    type: load_video
    inputs:
      video: video_path
  - id: build_ocr_transcript
    type: build_ocr_transcript
    inputs:
      ocr_frames: ocr_frames_path
      video: video_path
      language: language
      frame_interval_sec: frame_interval_sec
      dedupe_similarity: dedupe_similarity
      merge_gap_sec: merge_gap_sec
      min_text_chars: min_text_chars
  - id: write_ocr_transcript
    type: write_ocr_transcript
    inputs:
      transcript: ocr_transcript
    outputs:
      transcript: ocr_transcript.json
      manifest: ocr_transcript_manifest.json
  - id: generate_candidate_windows
    type: generate_candidate_windows
    inputs:
      transcript: transcript
      max_window_size: max_window_size
      min_duration_sec: min_duration_sec
      max_duration_sec: max_duration_sec
    outputs:
      candidate_windows: candidate_windows.json
  - id: score_candidate_windows
    type: score_candidate_windows
    inputs:
      candidate_windows: candidate_windows
      max_selected: max_selected
      max_overlap_ratio: max_overlap_ratio
  - id: write_highlight_score_report
    type: write_highlight_score_report
    inputs:
      highlight_score_report: highlight_score_report
    outputs:
      highlight_score_report: highlight_score_report.json
  - id: write_highlight_plan
    type: write_highlight_plan
    inputs:
      highlight_plan: highlight_plan
    outputs:
      highlight_plan: highlight_plan.json
