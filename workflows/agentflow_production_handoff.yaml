name: agentflow_production_brief_to_production_handoff_v0.1
version: 1
mode: local_deterministic
quality_profile: agentflow_production_handoff
metadata:
  module: AgentFlow Production
  kind: production
  audience:
    - agent
  content_mode: episodic_story_production
  description: Provider-gated structured production handoff generator.
steps:
  - id: load_creative_brief
    type: agentflow_production_load_creative_brief
    inputs:
      creative_brief: creative_brief
    outputs:
      creative_brief: creative_brief.json
  - id: build_story_bible
    type: agentflow_production_build_story_bible
    inputs:
      creative_brief: creative_brief
    outputs:
      story_bible: story_bible.json
  - id: build_episode_outline
    type: agentflow_production_build_episode_outline
    inputs:
      creative_brief: creative_brief
      story_bible: story_bible
    outputs:
      episode_outline: episode_outline.json
  - id: build_scene_plan
    type: agentflow_production_build_scene_plan
    inputs:
      episode_outline: episode_outline
    outputs:
      scene_plan: scene_plan.json
  - id: build_shot_plan
    type: agentflow_production_build_shot_plan
    inputs:
      creative_brief: creative_brief
      scene_plan: scene_plan
    outputs:
      shot_plan: shot_plan.json
  - id: build_prompt_pack
    type: agentflow_production_build_prompt_pack
    inputs:
      story_bible: story_bible
      shot_plan: shot_plan
    outputs:
      prompt_pack: prompt_pack.json
  - id: build_production_handoff
    type: agentflow_production_build_production_handoff
    inputs:
      creative_brief: creative_brief
      story_bible: story_bible
      episode_outline: episode_outline
      scene_plan: scene_plan
      shot_plan: shot_plan
      prompt_pack: prompt_pack
    outputs:
      production_handoff: production_handoff.json
      production_report: production_report.md
