<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AFS Studio 创作图谱</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/drawer-resize.css" />
    <link rel="stylesheet" href="./styles/assets.css" />
    <link rel="stylesheet" href="./styles/canvas.css" />
    <link rel="stylesheet" href="./styles/canvas-edges.css" />
    <link rel="stylesheet" href="./styles/node-result.css" />
    <link rel="stylesheet" href="./styles/prompt-bar.css" />
    <link rel="stylesheet" href="./styles/popovers.css" />
    <link rel="stylesheet" href="./styles/modals.css" />
    <link rel="stylesheet" href="./styles/director.css" />
    <link rel="stylesheet" href="./styles/studio-workbench.css" />
    <link rel="stylesheet" href="./styles/studio-portal.css" />
    <link rel="stylesheet" href="./styles/studio-wave.css" />
    <link rel="stylesheet" href="./styles/studio-interactions.css" />
    <link rel="stylesheet" href="./styles/interaction-motion.css" />
    <link rel="stylesheet" href="./styles/generation-feedback.css" />
    <link rel="stylesheet" href="./styles/studio-canvas-maturity.css" />
    <link rel="stylesheet" href="./styles/studio-mature-shell.css" />
    <link rel="stylesheet" href="./styles/studio-inspector-declutter.css" />
    <link rel="stylesheet" href="./styles/inspector-collapse.css" />
    <link rel="stylesheet" href="./styles/studio-media-experience.css" />
    <link rel="stylesheet" href="./styles/studio-sprite.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar"></header>
      <aside id="drawer"></aside>
      <main id="canvas-root">
        <div id="canvas-viewport">
          <div id="world">
            <svg id="edge-layer" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="node-layer"></div>
          </div>
        </div>
        <div id="canvas-empty-hint" hidden>
          <div class="empty-kicker">AFS Studio</div>
          <div class="canvas-empty-title">开始创作一个视频项目</div>
          <div class="canvas-empty-copy">选择下方模板，或双击任意位置创建文本、图片、视频、脚本和导演台节点。</div>
          <div class="canvas-empty-shortcuts">
            <span class="hint-chip">双击画布</span>
            <span class="hint-chip">Tab 添加节点</span>
            <span class="hint-dim">拖动节点连线组织流程</span>
          </div>
        </div>
        <div id="starter-row" hidden></div>
        <div id="prompt-bar-layer"></div>
      </main>
      <aside id="inspector"></aside>
      <footer id="dock"></footer>
      <div id="corner-controls"></div>
      <div id="sprite-root"></div>
      <div id="overlay-root"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
