id: agentflow_studio.video_script_highlight_package
name: Video Script Highlight Package
version: 1
status: product_mvp
description: Generate a local-first short promotional package from a source video and script.
primary_workflow: workflows/video_script_to_finished_package_local_asr.yaml
input_contract:
  required:
    - video_path
    - source_video
    - script_path
    - roi_config_path
    - bgm_path
    - bgm_metadata_path
  optional:
    - language
    - asr_model
    - asr_device
    - asr_compute_type
    - alignment_min_confidence
    - candidate_target_window_sec
    - max_clips
output_artifacts:
  - finished_package_manifest.json
  - package_report.md
  - review_report.json
  - quality_report.json
  - delivery_readiness.json
  - delivery_readiness.md
  - script_highlight_alignment.json
  - boundary_signal_manifest.json
  - candidate_windows.json
  - highlight_score_report.json
  - selection_diagnostics.json
quality_gates:
  - inspect-run
  - review-run
  - delivery-readiness
  - short_clip_quality
dependencies:
  local:
    - ffmpeg
    - ffprobe
    - faster-whisper
  network: false
when_to_use:
  - The user has both source video and script or synopsis.
  - The script should guide highlight selection while video timestamps come from ASR.
when_not_to_use:
  - The script is unrelated to the video and cannot be aligned.
  - The user wants remote LLM or remote ASR without explicit opt-in.
failure_recovery:
  low_alignment_confidence: Lower acceptance threshold only for smoke testing, or improve the script/transcript quality.
  skipped_script_highlights: Inspect script_highlight_alignment.json before rerunning.
  weak_highlight_quality: Review rejected candidates, near misses, and selected clip reasons in package_report.md and selection_diagnostics.json.
  weak_boundary_evidence: Treat boundary_signal_manifest.json as advisory and review clip starts/ends manually.
